<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Passwort wiederherstellen – Hohenegg Finanzstudio</title>
  <link rel="stylesheet" href="/password-common.css">
</head>
<body>
  <main>
    <div class="brand no-print">
      <span class="mark" aria-hidden="true">H</span>
      <div><h1>Passwort wiederherstellen</h1><p class="subtitle">Hohenegg Finanzstudio</p></div>
    </div>
    <form id="password-form">
      <p class="hint">Gib deinen Wiederherstellungscode ein und wähle ein neues Passwort.</p>
      <label for="recovery-code-input">Wiederherstellungscode</label>
      <input id="recovery-code-input" name="recovery-code" type="text" autocomplete="off" spellcheck="false" required autofocus>
      <label for="new-password">Neues Passwort</label>
      <input id="new-password" name="new-password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
      <label for="repeat-password">Passwort wiederholen</label>
      <input id="repeat-password" name="repeat-password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
      <button id="submit-button" type="submit">Passwort wiederherstellen</button>
      <p id="meldung" class="meldung" role="alert" aria-live="polite"></p>
    </form>
    <section id="recovery-panel" class="recovery-card" hidden aria-labelledby="recovery-heading" aria-live="polite" tabindex="-1">
      <h2 id="recovery-heading">Neuer Wiederherstellungscode</h2>
      <p class="hint">Der bisherige Code ist nicht mehr gültig. Bewahre diesen Code sicher auf.</p>
      <output id="recovery-code" class="recovery-code"></output>
      <p id="copy-status" class="meldung no-print" role="status" aria-live="polite"></p>
      <div class="actions no-print">
        <button id="copy-code" type="button" class="secondary">Kopieren</button>
        <button id="download-code" type="button" class="secondary">Herunterladen</button>
        <button id="print-code" type="button" class="secondary">Drucken</button>
      </div>
    </section>
    <a class="secondary-link no-print" href="/login.html">Zurück zur Anmeldung</a>
  </main>
  <script src="/password-recover.js"></script>
</body>
</html>
