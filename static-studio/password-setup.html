<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Passwort einrichten – Hohenegg Finanzstudio</title>
  <link rel="stylesheet" href="/password-common.css">
</head>
<body>
  <main>
    <div class="brand no-print">
      <span class="mark" aria-hidden="true">H</span>
      <div><h1>Passwort einrichten</h1><p class="subtitle">Hohenegg Finanzstudio</p></div>
    </div>
    <form id="password-form">
      <p class="hint">Bitte ersetze das Startpasswort durch dein eigenes Passwort.</p>
      <label for="new-password">Neues Passwort</label>
      <input id="new-password" name="new-password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required autofocus>
      <label for="repeat-password">Passwort wiederholen</label>
      <input id="repeat-password" name="repeat-password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
      <button id="submit-button" type="submit">Passwort sicher speichern</button>
      <p id="meldung" class="meldung" role="alert" aria-live="polite"></p>
    </form>
    <section id="recovery-panel" class="recovery-card" hidden aria-labelledby="recovery-heading">
      <h2 id="recovery-heading">Wiederherstellungscode</h2>
      <p class="hint">Dieser Code wird nur jetzt angezeigt. Bewahre ihn getrennt vom Passwort auf.</p>
      <output id="recovery-code" class="recovery-code"></output>
      <div class="actions no-print">
        <button id="download-code" type="button" class="secondary">Herunterladen</button>
        <button id="print-code" type="button" class="secondary">Drucken</button>
      </div>
    </section>
  </main>
  <script src="/password-setup.js"></script>
</body>
</html>
