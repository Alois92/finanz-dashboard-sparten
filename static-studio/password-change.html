<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Passwort ändern – Hohenegg Finanzstudio</title>
  <link rel="stylesheet" href="/password-common.css">
</head>
<body>
  <main>
    <div class="brand">
      <span class="mark" aria-hidden="true">H</span>
      <div><h1>Passwort ändern</h1><p class="subtitle">Hohenegg Finanzstudio</p></div>
    </div>
    <form id="password-form">
      <label for="current-password">Aktuelles Passwort</label>
      <input id="current-password" name="current-password" type="password" minlength="6" maxlength="128" autocomplete="current-password" required autofocus>
      <label for="new-password">Neues Passwort</label>
      <input id="new-password" name="new-password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
      <label for="repeat-password">Neues Passwort wiederholen</label>
      <input id="repeat-password" name="repeat-password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required>
      <button id="submit-button" type="submit">Passwort ändern</button>
      <p id="meldung" class="meldung" role="alert" aria-live="polite"></p>
    </form>
    <a class="secondary-link" href="/">Zurück zum Finanzstudio</a>
  </main>
  <script src="/password-change.js"></script>
</body>
</html>
