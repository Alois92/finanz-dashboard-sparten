<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Anmeldung – Hohenegg Finanzstudio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #0d151d;
      color: #edf5f2;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 15%, rgba(68, 199, 148, .12), transparent 34%),
        #0d151d;
    }
    main {
      width: min(100%, 420px);
      padding: 34px;
      border: 1px solid #263744;
      border-radius: 20px;
      background: #131f29;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .32);
    }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
    .mark {
      width: 48px; height: 48px; display: grid; place-items: center;
      border-radius: 13px; background: #48c893; color: #092419;
      font-size: 24px; font-weight: 800;
    }
    h1 { margin: 0; font-size: 23px; }
    .subtitle { margin: 4px 0 0; color: #91a8b7; font-size: 14px; }
    label { display: block; margin-bottom: 9px; color: #b9c9d3; font-weight: 650; }
    input {
      width: 100%; min-height: 48px; padding: 0 14px;
      border: 1px solid #36505f; border-radius: 10px;
      background: #0b141b; color: #fff; font: inherit;
    }
    input:focus { outline: 2px solid #48c893; outline-offset: 1px; }
    button {
      width: 100%; min-height: 48px; margin-top: 17px;
      border: 0; border-radius: 10px; background: #48c893;
      color: #08271b; font: inherit; font-weight: 800; cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #meldung { min-height: 22px; margin: 14px 0 0; color: #ff9d89; font-size: 14px; }
    .schutz { margin: 22px 0 0; color: #7f98a8; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <span class="mark" aria-hidden="true">H</span>
      <div>
        <h1>Hohenegg Finanzstudio</h1>
        <p class="subtitle">Geschützter Zugriff auf Finanzdaten</p>
      </div>
    </div>
    <form id="login-form">
      <label for="password">Passwort</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required autofocus>
      <button id="login-button" type="submit">Sicher anmelden</button>
      <p id="meldung" role="alert" aria-live="polite"></p>
    </form>
    <p class="schutz">Die Verbindung ist zusätzlich durch dein privates
      Tailscale-Netz und HTTPS geschützt.</p>
  </main>
  <script src="/login.js"></script>
</body>
</html>
